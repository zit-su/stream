<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>MyFlix</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

body{
  background:#111;
  margin:0;
}

video{
  width:100%;
  height:100vh;
  background:black;
}

</style>

</head>

<body>

<video id="video" controls autoplay></video>

<script>

const video = document.getElementById("video");

if(Hls.isSupported()){

  const hls = new Hls();

  hls.loadSource(
    "https://huggingface.co/datasets/sunnymavale/myflix-videos/resolve/main/movie2/master.m3u8"
  );

  hls.attachMedia(video);
}

</script>

</body>
</html>
