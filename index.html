<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>MyFlix</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

body{
  background:#111;
  margin:0;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

video{
  width:100%;
  max-width:900px;
}

</style>

</head>

<body>

<video id="video" controls></video>

<script>

const video = document.getElementById("video");

if(Hls.isSupported()){

  const hls = new Hls();

  hls.loadSource(
    "https://huggingface.co/datasets/sunnymavale/myflix-videos/resolve/main/movie1/master.m3u8"
  );

  hls.attachMedia(video);
}

</script>

</body>
</html>
