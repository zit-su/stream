<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - YouTube Clone</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container-fluid">
            <a href="index.html" class="brand"><i class="bi bi-play-circle"></i> Streamify</a>
            <div class="nav-links">
                <a href="index.html" class="active">Home</a>
                <a href="series.html">Series</a>
            </div>
            <input type="text" class="search-bar" id="searchInput" placeholder="Search...">
            <div id="authButtons"></div>
        </div>
    </nav>

    <div class="container-fluid mt-4" style="max-width:1400px; margin:auto;">
        <div class="card-grid" id="videoGrid">
            <div class="text-center" style="grid-column:1/-1; padding:3rem;">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-2">Loading videos...</p>
            </div>
        </div>
    </div>

    <button class="btn btn-danger" id="uploadBtn" style="position:fixed; bottom:2rem; right:2rem; border-radius:50%; width:56px; height:56px; display:none;">
        <i class="bi bi-plus-lg"></i>
    </button>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="js/app.js"></script>
    <script>
        // ... (same Firebase init and auth logic as before, but using new CSS classes)

</body>
</html>
