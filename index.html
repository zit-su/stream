<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Streamify - Home</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body {
            background: #000;
            color: #fff;
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            padding-bottom: 70px;
        }
        .navbar {
            background: #0a0a0a;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222;
        }
        .brand {
            font-size: 1.5rem;
            font-weight: bold;
            color: #00a8e1;
        }
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
            padding: 15px;
        }
        .video-card {
            background: #111;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
        }
        .video-card img {
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: cover;
        }
        .video-info {
            padding: 10px;
        }
        .video-title {
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 5px;
        }
        .video-meta {
            font-size: 0.8rem;
            color: #aaa;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #0a0a0a;
            display: flex;
            justify-content: space-around;
            padding: 8px;
            border-top: 1px solid #222;
        }
        .bottom-nav a {
            color: #aaa;
            text-align: center;
            text-decoration: none;
            font-size: 0.8rem;
        }
        .bottom-nav a.active {
            color: #00a8e1;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="brand">Streamify</div>
        <div id="authButtons">
            <a href="login.html" style="color:#aaa; text-decoration:none;">Sign In</a>
        </div>
    </nav>

    <div class="video-grid" id="videoGrid">
        <p style="grid-column:1/-1; text-align:center;">Loading videos...</p>
    </div>

    <div class="bottom-nav">
        <a href="index.html" class="active">Home</a>
        <a href="my-uploads.html">Upload</a>
        <a href="login.html">Sign In</a>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAAPNK7PEPK90SMSQDCSne3wBr1OYoAXxM",
            authDomain: "store-data-for-sms.firebaseapp.com",
            databaseURL: "https://store-data-for-sms-default-rtdb.firebaseio.com",
            projectId: "store-data-for-sms",
            storageBucket: "store-data-for-sms.firebasestorage.app",
            messagingSenderId: "508840668923",
            appId: "1:508840668923:web:0e1e9ebc788bdf1e74ca5e"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        // Auth state
        const authDiv = document.getElementById('authButtons');
        const bottomSignIn = document.querySelector('.bottom-nav a[href="login.html"]');
        auth.onAuthStateChanged(user => {
            if (user) {
                authDiv.innerHTML = `<span style="color:#aaa;">${user.email.split('@')[0]}</span>
                    <button id="logoutBtn" style="background:#333; color:#fff; border:none; padding:5px 10px; border-radius:5px;">Logout</button>`;
                document.getElementById('logoutBtn').addEventListener('click', () => auth.signOut());
                if (bottomSignIn) {
                    bottomSignIn.innerHTML = 'Profile';
                    bottomSignIn.href = 'my-uploads.html';
                }
            } else {
                authDiv.innerHTML = '<a href="login.html" style="color:#aaa; text-decoration:none;">Sign In</a>';
                if (bottomSignIn) {
                    bottomSignIn.innerHTML = 'Sign In';
                    bottomSignIn.href = 'login.html';
                }
            }
        });

        // Load videos
        function loadVideos() {
            db.ref('videos').once('value').then(snap => {
                const videos = [];
                snap.forEach(child => videos.push({ id: child.key, ...child.val() }));
                videos.sort((a,b) => (b.timestamp||0) - (a.timestamp||0));
                displayVideos(videos);
            }).catch(err => {
                document.getElementById('videoGrid').innerHTML = '<p style="grid-column:1/-1; text-align:center; color:red;">Error loading videos: ' + err.message + '</p>';
                console.error(err);
            });
        }

        function displayVideos(videos) {
            const grid = document.getElementById('videoGrid');
            if (!videos.length) {
                grid.innerHTML = '<p style="grid-column:1/-1; text-align:center;">No videos yet.</p>';
                return;
            }
            grid.innerHTML = videos.map(v => `
                <div class="video-card" onclick="window.location.href='watch.html?id=${v.id}'">
                    <img src="${v.thumbnail || 'https://via.placeholder.com/320x180'}" alt="${v.title}">
                    <div class="video-info">
                        <div class="video-title">${v.title || 'Untitled'}</div>
                        <div class="video-meta">${v.channel || 'Unknown'} • ${v.views || 0} views</div>
                    </div>
                </div>
            `).join('');
        }

        loadVideos();
    </script>
</body>
</html>
