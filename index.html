<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - YouTube Clone</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container-fluid">
            <a href="index.html" class="brand"><i class="bi bi-play-circle"></i> Streamify</a>
            <div class="nav-links">
                <a href="index.html" class="active">Home</a>
                <a href="series.html">Series</a>
                <a href="my-uploads.html">My Uploads</a>
            </div>
            <input type="text" class="search-bar" id="searchInput" placeholder="Search...">
            <div id="authButtons">
                <a href="login.html" class="btn btn-outline"><i class="bi bi-person-circle"></i> Sign In</a>
            </div>
        </div>
    </nav>

    <div style="max-width:1400px; margin:auto; padding: 0 1rem;">
        <div class="card-grid" id="videoGrid"></div>
    </div>

    <button class="btn btn-danger" id="uploadBtn" style="position:fixed; bottom:2rem; right:2rem; border-radius:50%; width:56px; height:56px; display:none;">
        <i class="bi bi-plus-lg"></i>
    </button>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAAPNK7PEPK90SMSQDCSne3wBr1OYoAXxM",
            authDomain: "store-data-for-sms.firebaseapp.com",
            databaseURL: "https://store-data-for-sms-default-rtdb.firebaseio.com",
            projectId: "store-data-for-sms",
            storageBucket: "store-data-for-sms.firebasestorage.app",
            messagingSenderId: "508840668923",
            appId: "1:508840668923:web:0e1e9ebc788bdf1e74ca5e"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        const authDiv = document.getElementById('authButtons');
        const uploadBtn = document.getElementById('uploadBtn');

        auth.onAuthStateChanged(user => {
            if (user) {
                authDiv.innerHTML = `<div class="d-flex align-items-center gap-2">
                    <span>${user.email}</span>
                    <button class="btn btn-outline btn-sm" id="logoutBtn">Sign Out</button>
                </div>`;
                document.getElementById('logoutBtn').addEventListener('click', () => auth.signOut());
                uploadBtn.style.display = 'block';
                uploadBtn.onclick = () => window.location.href = 'my-uploads.html';
            } else {
                authDiv.innerHTML = '<a href="login.html" class="btn btn-outline"><i class="bi bi-person-circle"></i> Sign In</a>';
                uploadBtn.style.display = 'none';
            }
        });

        function loadVideos() {
            db.ref('videos').once('value').then(snap => {
                const videos = [];
                snap.forEach(child => videos.push({ id: child.key, ...child.val() }));
                videos.sort((a,b) => (b.timestamp||0) - (a.timestamp||0));
                displayVideos(videos);
            }).catch(err => {
                document.getElementById('videoGrid').innerHTML = '<p class="text-center mt-4">Failed to load videos.</p>';
                console.error(err);
            });
        }

        function displayVideos(videos) {
            const grid = document.getElementById('videoGrid');
            if (!videos.length) {
                grid.innerHTML = '<p class="text-center mt-4">No videos yet. Upload your first!</p>';
                return;
            }
            grid.innerHTML = videos.map(v => `
                <div class="video-card" onclick="window.location.href='watch.html?id=${v.id}'">
                    <div class="thumbnail-wrapper">
                        <img src="${v.thumbnail || 'https://via.placeholder.com/320x180'}" alt="${v.title}">
                    </div>
                    <div class="card-body">
                        <div class="card-title">${v.title || 'Untitled'}</div>
                        <div class="card-meta">
                            <a href="channel.html?uid=${v.uploaderId}" class="channel-link" onclick="event.stopPropagation()">${v.channel || 'Unknown'}</a>
                            <span>•</span>
                            <span>${v.views || 0} views</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        document.getElementById('searchInput').addEventListener('input', e => {
            const term = e.target.value.toLowerCase();
            document.querySelectorAll('.video-card').forEach(card => {
                const title = card.querySelector('.card-title')?.textContent.toLowerCase() || '';
                const channel = card.querySelector('.channel-link')?.textContent.toLowerCase() || '';
                card.style.display = (title.includes(term) || channel.includes(term)) ? 'block' : 'none';
            });
        });

        loadVideos();
    </script>
</body>
</html>
