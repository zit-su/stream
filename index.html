<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Clone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        :root { --bg-primary: #0f0f0f; --bg-secondary: #272727; --text-primary: #ffffff; --text-secondary: #aaaaaa; }
        body { background-color: var(--bg-primary); color: var(--text-primary); font-family: 'Roboto', sans-serif; }
        .navbar { background-color: var(--bg-primary); border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 100; }
        .video-card { background: transparent; border: none; cursor: pointer; transition: transform 0.2s; margin-bottom: 20px; }
        .video-card:hover { transform: scale(1.02); }
        .thumbnail { width: 100%; border-radius: 12px; aspect-ratio: 16/9; object-fit: cover; background: #272727; }
        .video-info { display: flex; padding: 12px 0; }
        .channel-icon { width: 36px; height: 36px; border-radius: 50%; margin-right: 12px; background: #4caf50; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; text-decoration: none; }
        .video-title { font-size: 14px; font-weight: 500; margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .channel-name, .video-stats { font-size: 12px; color: var(--text-secondary); }
        .upload-btn { position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; border-radius: 50%; background: #ff0000; color: white; border: none; font-size: 24px; box-shadow: 0 4px 20px rgba(255,0,0,0.3); z-index: 1000; }
        .loading { text-align: center; padding: 40px; }
        .search-bar { background: var(--bg-secondary); border: 1px solid #333; color: white; border-radius: 20px; padding: 8px 20px; width: 100%; max-width: 600px; }
        .search-bar:focus { outline: none; border-color: #1c62b9; background: #121212; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand text-white" href="#"><i class="bi bi-youtube text-danger" style="font-size: 28px;"></i><span class="ms-2 fw-bold">YouTube Clone</span></a>
            <div class="flex-grow-1 mx-4"><input type="text" class="search-bar" placeholder="Search" id="searchInput"></div>
            <div id="authButtons"><button class="btn btn-outline-light btn-sm" id="loginBtn"><i class="bi bi-person-circle"></i> Sign In</button></div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row" id="videoGrid">
            <div class="loading"><div class="spinner-border text-danger"></div><p class="mt-2">Loading videos...</p></div>
        </div>
    </div>

    <button class="upload-btn d-none" id="uploadBtn" title="Upload Video"><i class="bi bi-plus-lg"></i></button>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAAPNK7PEPK90SMSQDCSne3wBr1OYoAXxM",
            authDomain: "store-data-for-sms.firebaseapp.com",
            databaseURL: "https://store-data-for-sms-default-rtdb.firebaseio.com",
            projectId: "store-data-for-sms",
            storageBucket: "store-data-for-sms.firebasestorage.app",
            messagingSenderId: "508840668923",
            appId: "1:508840668923:web:0e1e9ebc788bdf1e74ca5e"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        auth.onAuthStateChanged((user) => {
            const loginBtn = document.getElementById('loginBtn');
            const uploadBtn = document.getElementById('uploadBtn');
            if (user) {
                loginBtn.innerHTML = `<i class="bi bi-person-check"></i> ${user.email}`;
                loginBtn.className = 'btn btn-outline-success btn-sm';
                uploadBtn.classList.remove('d-none');
                loginBtn.onclick = () => { if (confirm('Sign out?')) auth.signOut(); };
            } else {
                loginBtn.innerHTML = '<i class="bi bi-person-circle"></i> Sign In';
                loginBtn.className = 'btn btn-outline-light btn-sm';
                uploadBtn.classList.add('d-none');
                loginBtn.onclick = () => {
                    const email = prompt('Email:');
                    if (!email) return;
                    const password = prompt('Password:');
                    if (!password) return;
                    auth.signInWithEmailAndPassword(email, password)
                        .catch((error) => {
                            if (error.code === 'auth/user-not-found') {
                                if (confirm('Create new account?')) {
                                    auth.createUserWithEmailAndPassword(email, password)
                                        .catch(err => alert(err.message));
                                }
                            } else {
                                alert(error.message);
                            }
                        });
                };
            }
        });

        document.getElementById('uploadBtn').addEventListener('click', () => { window.location.href = 'upload.html'; });

        function loadVideos() {
            db.ref('videos').orderByChild('timestamp').once('value')
                .then((snapshot) => {
                    const videos = [];
                    snapshot.forEach(child => videos.push({ id: child.key, ...child.val() }));
                    videos.reverse();
                    displayVideos(videos);
                })
                .catch(error => {
                    console.error('Error loading videos:', error);
                    document.getElementById('videoGrid').innerHTML = '<div class="col-12 text-center"><p>No videos found.</p></div>';
                });
        }

        function displayVideos(videos) {
            const videoGrid = document.getElementById('videoGrid');
            if (!videos.length) {
                videoGrid.innerHTML = '<div class="col-12 text-center"><p>No videos available</p></div>';
                return;
            }
            videoGrid.innerHTML = videos.map(video => `
                <div class="col-12 col-sm-6 col-md-4 col-lg-3">
                    <div class="video-card" onclick="window.location.href='watch.html?id=${video.id}'">
                        <img class="thumbnail" src="${video.thumbnail || 'https://via.placeholder.com/320x180'}" alt="thumbnail">
                        <div class="video-info">
                            <a href="channel.html?uid=${video.uploaderId}" class="channel-icon" onclick="event.stopPropagation();">${(video.channel || 'U').charAt(0).toUpperCase()}</a>
                            <div>
                                <div class="video-title">${video.title || 'Untitled'}</div>
                                <a href="channel.html?uid=${video.uploaderId}" class="channel-name" onclick="event.stopPropagation();" style="text-decoration: none; color: #aaaaaa;">${video.channel || 'Anonymous'}</a>
                                <div class="video-stats">${video.views || 0} views • ${getTimeAgo(video.timestamp)}</div>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function getTimeAgo(timestamp) {
            if (!timestamp) return 'Just now';
            const now = Date.now();
            const seconds = Math.floor((now - timestamp) / 1000);
            if (seconds < 60) return 'Just now';
            if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;
            if (seconds < 86400) return `${Math.floor(seconds / 3600)}h ago`;
            if (seconds < 604800) return `${Math.floor(seconds / 86400)}d ago`;
            return new Date(timestamp).toLocaleDateString();
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            document.querySelectorAll('.video-card').forEach(card => {
                const title = card.querySelector('.video-title')?.textContent.toLowerCase() || '';
                const channel = card.querySelector('.channel-name')?.textContent.toLowerCase() || '';
                card.parentElement.style.display = (title.includes(term) || channel.includes(term)) ? 'block' : 'none';
            });
        });

        loadVideos();
    </script>
</body>
</html>
