<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Channel - MyFlix</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --bg-primary: #0f0f0f; --bg-secondary: #272727; --text-primary: #ffffff; --text-secondary: #aaaaaa; }
        body { background-color: var(--bg-primary); color: var(--text-primary); font-family: 'Roboto', sans-serif; }
        .navbar { background: var(--bg-primary); border-bottom: 1px solid #333; }
        .channel-header { padding: 30px 0; display: flex; align-items: center; gap: 20px; }
        .channel-avatar { width: 80px; height: 80px; border-radius: 50%; background: #4caf50; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: bold; }
        .video-card { cursor: pointer; transition: transform 0.2s; margin-bottom: 20px; }
        .video-card:hover { transform: scale(1.02); }
        .thumbnail { width: 100%; border-radius: 12px; aspect-ratio: 16/9; object-fit: cover; background: #272727; }
        .video-title { font-size: 14px; font-weight: 500; margin-top: 8px; }
        .video-stats { font-size: 12px; color: var(--text-secondary); }
        .loading { text-align: center; padding: 50px; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container-fluid">
            <a href="index.html" class="navbar-brand text-white"><i class="bi bi-youtube text-danger" style="font-size: 28px;"></i> MyFlix</a>
        </div>
    </nav>

    <div class="container" id="channelContent">
        <div class="loading"><div class="spinner-border text-danger"></div><p>Loading channel...</p></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAAPNK7PEPK90SMSQDCSne3wBr1OYoAXxM",
            authDomain: "store-data-for-sms.firebaseapp.com",
            databaseURL: "https://store-data-for-sms-default-rtdb.firebaseio.com",
            projectId: "store-data-for-sms",
            storageBucket: "store-data-for-sms.firebasestorage.app",
            messagingSenderId: "508840668923",
            appId: "1:508840668923:web:0e1e9ebc788bdf1e74ca5e"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const urlParams = new URLSearchParams(window.location.search);
        const uid = urlParams.get('uid');

        if (!uid) {
            document.getElementById('channelContent').innerHTML = '<div class="text-center p-5"><h3>No channel specified</h3></div>';
        } else {
            loadChannel(uid);
        }

        async function loadChannel(uid) {
            try {
                // Get videos by uploaderId
                const snapshot = await db.ref('videos').orderByChild('uploaderId').equalTo(uid).once('value');
                const videos = [];
                snapshot.forEach(child => {
                    videos.push({ id: child.key, ...child.val() });
                });
                videos.reverse(); // newest first

                if (videos.length === 0) {
                    document.getElementById('channelContent').innerHTML = '<div class="text-center p-5"><h3>No videos</h3></div>';
                    return;
                }

                const channelName = videos[0].channel || 'Unknown';
                const channelIcon = videos[0].channelIcon || 'U';

                const html = `
                    <div class="channel-header">
                        <div class="channel-avatar">${channelIcon}</div>
                        <div>
                            <h2>${channelName}</h2>
                            <p class="text-muted">${videos.length} video${videos.length > 1 ? 's' : ''}</p>
                        </div>
                    </div>
                    <div class="row">
                        ${videos.map(video => `
                            <div class="col-12 col-sm-6 col-md-4 col-lg-3">
                                <div class="video-card" onclick="window.location.href='watch.html?id=${video.id}'">
                                    <img class="thumbnail" src="${video.thumbnail || 'https://via.placeholder.com/320x180'}" alt="thumbnail">
                                    <div class="video-title">${video.title || 'Untitled'}</div>
                                    <div class="video-stats">${video.views || 0} views • ${getTimeAgo(video.timestamp)}</div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
                document.getElementById('channelContent').innerHTML = html;
            } catch (error) {
                console.error('Error loading channel:', error);
                document.getElementById('channelContent').innerHTML = '<div class="text-center p-5"><h3>Error loading channel</h3></div>';
            }
        }

        function getTimeAgo(timestamp) {
            if (!timestamp) return 'Just now';
            const now = Date.now();
            const seconds = Math.floor((now - timestamp) / 1000);
            if (seconds < 60) return 'Just now';
            if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;
            if (seconds < 86400) return `${Math.floor(seconds / 3600)}h ago`;
            if (seconds < 604800) return `${Math.floor(seconds / 86400)}d ago`;
            return new Date(timestamp).toLocaleDateString();
        }
    </script>
</body>
</html>
