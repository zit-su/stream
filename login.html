<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Sign In - Streamify</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1rem;">
    <div class="form-container" style="width:100%;">
        <div class="text-center mb-3">
            <i class="bi bi-play-circle" style="font-size:3rem; color:var(--accent);"></i>
            <h2>Streamify</h2>
        </div>
        <div class="auth-tabs">
            <button class="auth-tab active" id="loginTab">Sign In</button>
            <button class="auth-tab" id="registerTab">Create Account</button>
        </div>
        <form id="authForm">
            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" id="email" required>
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" id="password" required minlength="6">
            </div>
            <button type="submit" class="btn btn-primary w-100" id="submitBtn">Sign In</button>
        </form>
        <p id="errorMsg" style="color:var(--danger); margin-top:1rem; text-align:center;"></p>
        <p class="text-center mt-3"><a href="index.html">← Back to home</a></p>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script>
        const firebaseConfig = { /* same */ };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        let isLogin = true;
        document.getElementById('loginTab').addEventListener('click', () => {
            isLogin = true;
            document.getElementById('loginTab').classList.add('active');
            document.getElementById('registerTab').classList.remove('active');
            document.getElementById('submitBtn').textContent = 'Sign In';
        });
        document.getElementById('registerTab').addEventListener('click', () => {
            isLogin = false;
            document.getElementById('registerTab').classList.add('active');
            document.getElementById('loginTab').classList.remove('active');
            document.getElementById('submitBtn').textContent = 'Create Account';
        });

        document.getElementById('authForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            document.getElementById('errorMsg').textContent = '';
            try {
                if (isLogin) {
                    await auth.signInWithEmailAndPassword(email, password);
                } else {
                    await auth.createUserWithEmailAndPassword(email, password);
                }
                window.location.href = 'index.html';
            } catch (error) {
                document.getElementById('errorMsg').textContent = error.message;
            }
        });
    </script>
</body>
</html>
