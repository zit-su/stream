<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Video - YouTube Clone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #0f0f0f;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .upload-container {
            background: #1a1a1a;
            border-radius: 16px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        
        .file-upload-area {
            border: 2px dashed #333;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
        }
        
        .file-upload-area:hover {
            border-color: #ff0000;
            background: rgba(255,0,0,0.05);
        }
        
        .form-control {
            background: #272727;
            border: 1px solid #333;
            color: white;
        }
        
        .form-control:focus {
            background: #333;
            border-color: #ff0000;
            color: white;
            box-shadow: none;
        }
        
        .progress {
            height: 8px;
            background: #333;
            border-radius: 4px;
            margin-top: 20px;
        }
        
        .progress-bar {
            background: #ff0000;
            border-radius: 4px;
        }
        
        .preview-video {
            width: 100%;
            border-radius: 8px;
            margin-bottom: 20px;
            max-height: 300px;
        }
    </style>
</head>
<body>
    <div class="upload-container">
        <h3 class="mb-4"><i class="bi bi-cloud-upload"></i> Upload Video</h3>
        
        <form id="uploadForm">
            <div class="file-upload-area" id="dropZone" onclick="document.getElementById('videoFile').click()">
                <i class="bi bi-camera-video" style="font-size: 48px; color: #666;"></i>
                <p class="mt-2 mb-0">Click or drag video here</p>
                <small class="text-muted">MP4, WebM, MOV (Max: 50MB)</small>
            </div>
            
            <input type="file" id="videoFile" accept="video/*" style="display: none;" required>
            
            <div class="mb-3">
                <label class="form-label">Title</label>
                <input type="text" class="form-control" id="videoTitle" placeholder="Add a title" required>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea class="form-control" id="videoDescription" rows="3" placeholder="Tell viewers about your video"></textarea>
            </div>
            
            <div class="progress d-none" id="uploadProgress">
                <div class="progress-bar" id="progressBar" style="width: 0%"></div>
            </div>
            
            <button type="submit" class="btn btn-danger w-100 mt-3" id="uploadSubmitBtn">
                <i class="bi bi-cloud-arrow-up"></i> Upload Video
            </button>
        </form>
        
        <a href="index.html" class="btn btn-outline-light w-100 mt-3">
            <i class="bi bi-arrow-left"></i> Back to Home
        </a>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
    
    <script>
        // Firebase config - SAME AS INDEX.HTML
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const storage = firebase.storage();
        
        // Check if user is logged in
        auth.onAuthStateChanged((user) => {
            if (!user) {
                alert('Please sign in to upload videos');
                window.location.href = 'index.html';
            }
        });
        
        // Drag and drop
        const dropZone = document.getElementById('dropZone');
        
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = '#ff0000';
        });
        
        dropZone.addEventListener('dragleave', () => {
            dropZone.style.borderColor = '#333';
        });
        
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = '#333';
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('video/')) {
                document.getElementById('videoFile').files = e.dataTransfer.files;
            }
        });
        
        document.getElementById('videoFile').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const videoPreview = document.createElement('video');
                videoPreview.className = 'preview-video';
                videoPreview.controls = true;
                videoPreview.src = URL.createObjectURL(file);
                
                const existingPreview = document.querySelector('.preview-video');
                if (existingPreview) {
                    existingPreview.remove();
                }
                
                dropZone.parentNode.insertBefore(videoPreview, dropZone.nextSibling);
            }
        });
        
        // Upload form submission
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const file = document.getElementById('videoFile').files[0];
            const title = document.getElementById('videoTitle').value;
            const description = document.getElementById('videoDescription').value;
            
            if (!file || !title) {
                alert('Please select a video and add a title');
                return;
            }
            
            // Check file size (50MB limit for free plan)
            if (file.size > 50 * 1024 * 1024) {
                alert('File size must be less than 50MB');
                return;
            }
            
            const user = auth.currentUser;
            const submitBtn = document.getElementById('uploadSubmitBtn');
            const progressBar = document.getElementById('progressBar');
            const progressDiv = document.getElementById('uploadProgress');
            
            submitBtn.disabled = true;
            progressDiv.classList.remove('d-none');
            
            try {
                // Upload to Firebase Storage
                const storageRef = storage.ref(`videos/${user.uid}/${Date.now()}_${file.name}`);
                const uploadTask = storageRef.put(file);
                
                uploadTask.on('state_changed', 
                    (snapshot) => {
                        const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                        progressBar.style.width = progress + '%';
                    },
                    (error) => {
                        console.error('Upload failed:', error);
                        alert('Upload failed: ' + error.message);
                        submitBtn.disabled = false;
                    },
                    async () => {
                        // Get download URL
                        const downloadURL = await uploadTask.snapshot.ref.getDownloadURL();
                        
                        // Save to Firestore
                        await db.collection('videos').add({
                            title: title,
                            description: description,
                            url: downloadURL,
                            thumbnail: downloadURL, // You can generate thumbnail later
                            channel: user.email.split('@')[0],
                            channelIcon: user.email.charAt(0).toUpperCase(),
                            uploaderId: user.uid,
                            views: 0,
                            likes: 0,
                            timestamp: firebase.firestore.FieldValue.serverTimestamp()
                        });
                        
                        // Also upload to Hugging Face for public access
                        await uploadToHuggingFace(file, title, downloadURL);
                        
                        alert('Video uploaded successfully!');
                        window.location.href = 'index.html';
                    }
                );
            } catch (error) {
                console.error('Error:', error);
                alert('Error uploading video: ' + error.message);
                submitBtn.disabled = false;
            }
        });
        
        // Upload to Hugging Face Space
        async function uploadToHuggingFace(file, title, firebaseUrl) {
            try {
                // Create a Hugging Face Space if you haven't already
                const HF_TOKEN = 'YOUR_HUGGING_FACE_TOKEN';
                
                const formData = new FormData();
                formData.append('file', file);
                formData.append('title', title);
                formData.append('firebaseUrl', firebaseUrl);
                
                const response = await fetch('https://huggingface.co/api/spaces/YOUR_SPACE_NAME/upload', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${HF_TOKEN}`
                    },
                    body: formData
                });
                
                if (!response.ok) {
                    console.warn('Hugging Face upload failed, but video is on Firebase');
                }
            } catch (error) {
                console.warn('Hugging Face upload error:', error);
            }
        }
    </script>
</body>
</html>
