<!DOCTYPE html>
<html>
<head>
  <title>My Stream</title>

  <style>
    body{
      background:#111;
      color:white;
      font-family:sans-serif;
      text-align:center;
    }

    .card{
      width:300px;
      margin:auto;
      background:#222;
      padding:15px;
      border-radius:12px;
    }

    video{
      width:100%;
      border-radius:10px;
    }

    button{
      padding:10px;
      border:none;
      border-radius:8px;
      background:#ff4444;
      color:white;
      cursor:pointer;
    }
  </style>
</head>

<body>

<h1>My Streaming Site</h1>

<div class="card">

<video controls>
  <source src="YOUR_VIDEO_LINK.mp4" type="video/mp4">
</video>

<h3>Demo Video</h3>

<button>Watch Now</button>

</div>

</body>
</html>
