<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Video - YouTube Clone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { background: #0f0f0f; color: white; margin: 0; padding: 0; }
        .video-container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        video { width: 100%; max-height: 70vh; background: #000; border-radius: 12px; }
        .video-details { padding: 20px 0; }
        .video-title { font-size: 20px; font-weight: 600; }
        .video-actions { display: flex; gap: 20px; margin: 20px 0; }
        .action-btn { background: #272727; border: none; color: white; padding: 10px 20px; border-radius: 20px; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: background 0.2s; }
        .action-btn:hover { background: #333; }
        .action-btn.liked { color: #065fd4; }
        .channel-section { display: flex; align-items: center; gap: 15px; padding: 15px 0; border-top: 1px solid #333; border-bottom: 1px solid #333; }
        .channel-icon-link { width: 40px; height: 40px; border-radius: 50%; background: #4caf50; display: flex; align-items: center; justify-content: center; font-weight: bold; text-decoration: none; color: white; }
        .description-box { background: #272727; border-radius: 12px; padding: 15px; margin-top: 15px; }
        .comments-section { margin-top: 30px; }
        .comment { background: #1a1a1a; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
        .comment small { color: #aaa; }
        .comment-input { background: #272727; border: 1px solid #333; color: white; border-radius: 8px; padding: 10px; width: 100%; margin-bottom: 10px; }
        .btn-comment { background: #065fd4; border: none; color: white; padding: 10px 20px; border-radius: 20px; }
        .loading { text-align: center; padding: 50px; }
        .error-box { background: #2a0000; color: #ff8888; padding: 15px; border-radius: 12px; margin: 20px; }
    </style>
</head>
<body>
    <nav class="navbar" style="background: #0f0f0f; border-bottom: 1px solid #333;">
        <div class="container-fluid">
            <a href="index.html" class="navbar-brand text-white"><i class="bi bi-youtube text-danger" style="font-size: 28px;"></i> YouTube Clone</a>
        </div>
    </nav>

    <div class="video-container" id="videoContent">
        <div class="loading"><div class="spinner-border text-danger"></div></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAAPNK7PEPK90SMSQDCSne3wBr1OYoAXxM",
            authDomain: "store-data-for-sms.firebaseapp.com",
            databaseURL: "https://store-data-for-sms-default-rtdb.firebaseio.com",
            projectId: "store-data-for-sms",
            storageBucket: "store-data-for-sms.firebasestorage.app",
            messagingSenderId: "508840668923",
            appId: "1:508840668923:web:0e1e9ebc788bdf1e74ca5e"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();

        const urlParams = new URLSearchParams(window.location.search);
        const videoId = urlParams.get('id');
        const type = urlParams.get('type'); // "episode" for series episodes
        let currentUser = null;

        auth.onAuthStateChanged((user) => {
            currentUser = user;
            loadVideo();
        });

        async function loadVideo() {
            if (!videoId) { window.location.href = 'index.html'; return; }
            const videoContent = document.getElementById('videoContent');

            try {
                let snapshot;
                if (type === 'episode') {
                    snapshot = await db.ref('episodes/' + videoId).once('value');
                } else {
                    snapshot = await db.ref('videos/' + videoId).once('value');
                }

                if (!snapshot.exists()) {
                    videoContent.innerHTML = '<div class="error-box">Video not found in database. It may have been deleted.</div>';
                    return;
                }

                const rawData = snapshot.val();
                // Normalize to a common video object
                const video = {
                    url: rawData.videoUrl || rawData.url || null,
                    title: rawData.title || 'Untitled',
                    description: rawData.description || '',
                    views: rawData.views || 0,
                    likes: rawData.likes || 0,
                    channel: rawData.channel || (type === 'episode' ? 'Series Episode' : 'Unknown'),
                    channelIcon: rawData.channelIcon || (type === 'episode' ? 'E' : 'U'),
                    uploaderId: rawData.uploaderId || null
                };

                if (!video.url) {
                    videoContent.innerHTML = '<div class="error-box">Video URL missing from database record.</div>';
                    return;
                }

                // Increment views
                if (type === 'episode') {
                    db.ref('episodes/' + videoId + '/views').transaction(current => (current || 0) + 1);
                } else {
                    db.ref('videos/' + videoId + '/views').transaction(current => (current || 0) + 1);
                }

                displayVideo(video);
                loadComments();
            } catch (error) {
                console.error('Error loading video:', error);
                videoContent.innerHTML = `<div class="error-box">
                    <strong>Error loading video:</strong> ${error.message}<br>
                    <small>Check the browser console (F12) for details.</small>
                </div>`;
            }
        }

        function displayVideo(video) {
            const content = document.getElementById('videoContent');
            const channelLink = video.uploaderId ? `channel.html?uid=${video.uploaderId}` : '#';

            content.innerHTML = `
                <video controls autoplay crossorigin="anonymous">
                    <source src="${encodeURI(video.url)}" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
                <div class="video-details">
                    <h1 class="video-title">${video.title || 'Untitled'}</h1>
                    <div class="d-flex justify-content-between align-items-center">
                        <span class="text-muted">${video.views || 0} views</span>
                        <div class="video-actions">
                            <button class="action-btn" id="likeBtn" onclick="toggleLike()">
                                <i class="bi bi-hand-thumbs-up"></i>
                                <span id="likeCount">${video.likes || 0}</span>
                            </button>
                            <button class="action-btn" onclick="shareVideo()">
                                <i class="bi bi-share"></i> Share
                            </button>
                        </div>
                    </div>
                    <div class="channel-section">
                        <a href="${channelLink}" class="channel-icon-link">${video.channelIcon || 'U'}</a>
                        <div>
                            <a href="${channelLink}" style="color: white; text-decoration: none;"><strong>${video.channel || 'Anonymous'}</strong></a>
                            <br><small class="text-muted">0 subscribers</small>
                        </div>
                    </div>
                    <div class="description-box"><p>${video.description || 'No description'}</p></div>
                </div>

                <!-- Comments Section -->
                <div class="comments-section">
                    <h5>Comments</h5>
                    ${currentUser ? `
                        <div class="d-flex gap-2">
                            <input type="text" class="comment-input" id="commentInput" placeholder="Add a comment...">
                            <button class="btn-comment" onclick="postComment()">Post</button>
                        </div>
                    ` : `<p><a href="#" onclick="signInPrompt()">Sign in</a> to comment.</p>`}
                    <div id="commentsList"></div>
                </div>
            `;

            const liked = localStorage.getItem(`liked_${videoId}`);
            if (liked) document.getElementById('likeBtn').classList.add('liked');

            // Add error listener for the video element
            const videoEl = content.querySelector('video');
            if (videoEl) {
                videoEl.addEventListener('error', () => {
                    alert('Video playback failed. Possible reasons:\n- Unsupported format\n- Server not responding\n- Incorrect URL');
                    console.error('Video element error:', videoEl.error);
                });
            }
        }

        function signInPrompt() {
            const email = prompt('Email:');
            if (!email) return;
            const password = prompt('Password:');
            if (!password) return;
            auth.signInWithEmailAndPassword(email, password)
                .catch(error => {
                    if (error.code === 'auth/user-not-found') {
                        if (confirm('Create new account?')) {
                            auth.createUserWithEmailAndPassword(email, password)
                                .catch(err => alert(err.message));
                        }
                    } else {
                        alert(error.message);
                    }
                });
        }

        function toggleLike() {
            const likeBtn = document.getElementById('likeBtn');
            const liked = localStorage.getItem(`liked_${videoId}`);
            const refPath = type === 'episode' ? 'episodes/' + videoId + '/likes' : 'videos/' + videoId + '/likes';
            if (liked) {
                localStorage.removeItem(`liked_${videoId}`);
                likeBtn.classList.remove('liked');
                db.ref(refPath).transaction(current => (current || 1) - 1);
                document.getElementById('likeCount').textContent = Math.max(0, parseInt(document.getElementById('likeCount').textContent) - 1);
            } else {
                localStorage.setItem(`liked_${videoId}`, 'true');
                likeBtn.classList.add('liked');
                db.ref(refPath).transaction(current => (current || 0) + 1);
                document.getElementById('likeCount').textContent = parseInt(document.getElementById('likeCount').textContent) + 1;
            }
        }

        function shareVideo() {
            const url = window.location.href;
            if (navigator.share) {
                navigator.share({ title: document.querySelector('.video-title')?.textContent || 'Video', url });
            } else {
                navigator.clipboard.writeText(url).then(() => alert('Link copied!'));
            }
        }

        function loadComments() {
            db.ref('comments').orderByChild('videoId').equalTo(videoId).on('value', (snapshot) => {
                const commentsList = document.getElementById('commentsList');
                if (!commentsList) return;
                let html = '';
                snapshot.forEach(child => {
                    const c = child.val();
                    html += `
                        <div class="comment">
                            <strong>${c.author}</strong> <small>${getTimeAgo(c.timestamp)}</small>
                            <p class="mb-0 mt-1">${c.text}</p>
                        </div>
                    `;
                });
                commentsList.innerHTML = html || '<p class="text-muted">No comments yet.</p>';
            });
        }

        function postComment() {
            const input = document.getElementById('commentInput');
            const text = input.value.trim();
            if (!text) return;
            if (!currentUser) { alert('Please sign in first'); return; }
            db.ref('comments').push({
                videoId: videoId,
                author: currentUser.email.split('@')[0],
                text: text,
                timestamp: Date.now()
            }).then(() => {
                input.value = '';
            }).catch(err => alert('Error: ' + err.message));
        }

        function getTimeAgo(timestamp) {
            if (!timestamp) return '';
            const now = Date.now();
            const seconds = Math.floor((now - timestamp) / 1000);
            if (seconds < 60) return 'Just now';
            if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;
            if (seconds < 86400) return `${Math.floor(seconds / 3600)}h ago`;
            if (seconds < 604800) return `${Math.floor(seconds / 86400)}d ago`;
            return new Date(timestamp).toLocaleDateString();
        }
    </script>
</body>
</html>
