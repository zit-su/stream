<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Video - YouTube Clone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #0f0f0f;
            color: white;
            margin: 0;
            padding: 0;
        }
        
        .video-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        video {
            width: 100%;
            max-height: 70vh;
            background: #000;
            border-radius: 12px;
        }
        
        .video-details {
            padding: 20px 0;
        }
        
        .video-title {
            font-size: 20px;
            font-weight: 600;
        }
        
        .video-actions {
            display: flex;
            gap: 20px;
            margin: 20px 0;
        }
        
        .action-btn {
            background: #272727;
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }
        
        .action-btn:hover {
            background: #333;
        }
        
        .action-btn.liked {
            color: #065fd4;
        }
        
        .channel-section {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px 0;
            border-top: 1px solid #333;
            border-bottom: 1px solid #333;
        }
        
        .description-box {
            background: #272727;
            border-radius: 12px;
            padding: 15px;
            margin-top: 15px;
        }
        
        .loading {
            text-align: center;
            padding: 50px;
        }
    </style>
</head>
<body>
    <nav class="navbar" style="background: #0f0f0f; border-bottom: 1px solid #333;">
        <div class="container-fluid">
            <a href="index.html" class="navbar-brand text-white">
                <i class="bi bi-youtube text-danger" style="font-size: 28px;"></i>
                YouTube Clone
            </a>
        </div>
    </nav>

    <div class="video-container" id="videoContent">
        <div class="loading">
            <div class="spinner-border text-danger" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <script>
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        
        // Get video ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const videoId = urlParams.get('id');
        
        async function loadVideo() {
            if (!videoId) {
                window.location.href = 'index.html';
                return;
            }
            
            try {
                const doc = await db.collection('videos').doc(videoId).get();
                
                if (!doc.exists) {
                    alert('Video not found');
                    window.location.href = 'index.html';
                    return;
                }
                
                const video = doc.data();
                
                // Increment view count
                db.collection('videos').doc(videoId).update({
                    views: firebase.firestore.FieldValue.increment(1)
                });
                
                displayVideo(video);
            } catch (error) {
                console.error('Error loading video:', error);
                document.getElementById('videoContent').innerHTML = 
                    '<div class="text-center p-5"><h3>Error loading video</h3></div>';
            }
        }
        
        function displayVideo(video) {
            const content = document.getElementById('videoContent');
            
            content.innerHTML = `
                <video controls autoplay>
                    <source src="${video.url}" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
                
                <div class="video-details">
                    <h1 class="video-title">${video.title || 'Untitled'}</h1>
                    
                    <div class="d-flex justify-content-between align-items-center">
                        <span class="text-muted">${video.views || 0} views</span>
                        
                        <div class="video-actions">
                            <button class="action-btn" id="likeBtn" onclick="toggleLike()">
                                <i class="bi bi-hand-thumbs-up"></i>
                                <span id="likeCount">${video.likes || 0}</span>
                            </button>
                            <button class="action-btn" onclick="shareVideo()">
                                <i class="bi bi-share"></i> Share
                            </button>
                        </div>
                    </div>
                    
                    <div class="channel-section">
                        <div style="width: 40px; height: 40px; border-radius: 50%; background: #4caf50; 
                                    display: flex; align-items: center; justify-content: center; font-weight: bold;">
                            ${video.channelIcon || 'U'}
                        </div>
                        <div>
                            <strong>${video.channel || 'Anonymous'}</strong>
                            <br>
                            <small class="text-muted">${video.subscribers || 0} subscribers</small>
                        </div>
                    </div>
                    
                    <div class="description-box">
                        <p>${video.description || 'No description'}</p>
                    </div>
                </div>
            `;
            
            // Check if already liked
            const liked = localStorage.getItem(`liked_${videoId}`);
            if (liked) {
                document.getElementById('likeBtn').classList.add('liked');
            }
        }
        
        function toggleLike() {
            const likeBtn = document.getElementById('likeBtn');
            const liked = localStorage.getItem(`liked_${videoId}`);
            
            if (liked) {
                localStorage.removeItem(`liked_${videoId}`);
                likeBtn.classList.remove('liked');
                // Decrease likes in Firestore
                db.collection('videos').doc(videoId).update({
                    likes: firebase.firestore.FieldValue.increment(-1)
                });
                const count = document.getElementById('likeCount');
                count.textContent = parseInt(count.textContent) - 1;
            } else {
                localStorage.setItem(`liked_${videoId}`, 'true');
                likeBtn.classList.add('liked');
                // Increase likes in Firestore
                db.collection('videos').doc(videoId).update({
                    likes: firebase.firestore.FieldValue.increment(1)
                });
                const count = document.getElementById('likeCount');
                count.textContent = parseInt(count.textContent) + 1;
            }
        }
        
        function shareVideo() {
            const url = window.location.href;
            
            if (navigator.share) {
                navigator.share({
                    title: document.querySelector('.video-title')?.textContent || 'Check out this video',
                    url: url
                });
            } else {
                navigator.clipboard.writeText(url).then(() => {
                    alert('Link copied to clipboard!');
                });
            }
        }
        
        loadVideo();
    </script>
</body>
</html>
