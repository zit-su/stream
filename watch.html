<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Watch - Streamify</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="brand"><i class="bi bi-play-circle"></i> Streamify</a>
            <a href="index.html" class="btn btn-outline btn-sm">← Back</a>
        </div>
    </nav>

    <div id="videoContent"></div>

    <div class="bottom-nav">
        <a href="index.html"><i class="bi bi-house-door"></i><span>Home</span></a>
        <a href="my-uploads.html"><i class="bi bi-plus-circle"></i><span>Upload</span></a>
        <a href="login.html"><i class="bi bi-person-circle"></i><span>Sign In</span></a>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script>
        const firebaseConfig = { /* same */ };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();
        const urlParams = new URLSearchParams(window.location.search);
        const videoId = urlParams.get('id');
        const type = urlParams.get('type');
        let currentUser = null;

        auth.onAuthStateChanged(user => { currentUser = user; loadVideo(); });

        async function loadVideo() {
            if (!videoId) return window.location.href = 'index.html';
            const content = document.getElementById('videoContent');
            try {
                let snapshot;
                if (type === 'episode') {
                    snapshot = await db.ref('episodes/' + videoId).once('value');
                } else {
                    snapshot = await db.ref('videos/' + videoId).once('value');
                }
                if (!snapshot.exists()) {
                    content.innerHTML = '<p class="text-center mt-4">Video not found.</p>';
                    return;
                }
                const data = snapshot.val();
                const video = {
                    url: data.videoUrl || data.url,
                    title: data.title || 'Untitled',
                    description: data.description || '',
                    views: data.views || 0,
                    likes: data.likes || 0,
                    channel: data.channel || (type === 'episode' ? 'Series Episode' : 'Unknown'),
                    channelIcon: data.channelIcon || 'U',
                    uploaderId: data.uploaderId || null
                };
                if (!video.url) { content.innerHTML = '<p class="text-center mt-4">Video URL missing.</p>'; return; }

                // Increment views
                const refPath = type === 'episode' ? 'episodes/' + videoId + '/views' : 'videos/' + videoId + '/views';
                db.ref(refPath).transaction(cur => (cur || 0) + 1);

                content.innerHTML = `
                    <video class="video-player" controls autoplay>
                        <source src="${encodeURI(video.url)}" type="video/mp4">
                    </video>
                    <div class="video-details">
                        <h2 style="font-size:1.3rem; margin-bottom:0.5rem;">${video.title}</h2>
                        <div style="display:flex; justify-content:space-between; margin-bottom:1rem;">
                            <span style="color:var(--text-secondary);">${video.views} views</span>
                            <div style="display:flex; gap:0.8rem;">
                                <button class="btn btn-outline btn-sm" id="likeBtn"><i class="bi bi-hand-thumbs-up"></i> <span id="likeCount">${video.likes}</span></button>
                                <button class="btn btn-outline btn-sm" onclick="shareVideo()"><i class="bi bi-share"></i></button>
                            </div>
                        </div>
                        <div style="display:flex; align-items:center; gap:1rem; padding:0.8rem 0; border-top:1px solid var(--border-color); border-bottom:1px solid var(--border-color);">
                            <div style="background:var(--accent); width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:bold;">${video.channelIcon}</div>
                            <div>
                                <strong>${video.channel}</strong>
                                <div style="font-size:0.8rem; color:var(--text-secondary);">0 subscribers</div>
                            </div>
                        </div>
                        <p style="margin-top:1rem; background:var(--bg-card); padding:0.8rem; border-radius:var(--radius);">${video.description}</p>
                    </div>
                    <div style="padding:0 1rem; margin-top:2rem;">
                        <h4>Comments</h4>
                        ${currentUser ? `
                            <div style="display:flex; gap:0.5rem; margin-bottom:1rem;">
                                <input type="text" class="form-control" id="commentInput" placeholder="Add a comment...">
                                <button class="btn btn-primary btn-sm" onclick="postComment()">Post</button>
                            </div>
                        ` : '<p><a href="login.html">Sign in</a> to comment.</p>'}
                        <div id="commentsList"></div>
                    </div>
                `;

                // Like button
                const liked = localStorage.getItem(`liked_${videoId}`);
                if (liked) document.getElementById('likeBtn').classList.add('active');
                document.getElementById('likeBtn').addEventListener('click', toggleLike);
                loadComments();
            } catch (e) {
                content.innerHTML = `<p class="text-center mt-4">Error: ${e.message}</p>`;
            }
        }

        function toggleLike() {
            const btn = document.getElementById('likeBtn');
            const liked = localStorage.getItem(`liked_${videoId}`);
            const refPath = type === 'episode' ? 'episodes/' + videoId + '/likes' : 'videos/' + videoId + '/likes';
            if (liked) {
                localStorage.removeItem(`liked_${videoId}`);
                btn.classList.remove('active');
                db.ref(refPath).transaction(cur => (cur || 1) - 1);
                document.getElementById('likeCount').textContent = Math.max(0, parseInt(document.getElementById('likeCount').textContent) - 1);
            } else {
                localStorage.setItem(`liked_${videoId}`, 'true');
                btn.classList.add('active');
                db.ref(refPath).transaction(cur => (cur || 0) + 1);
                document.getElementById('likeCount').textContent = parseInt(document.getElementById('likeCount').textContent) + 1;
            }
        }

        function shareVideo() {
            const url = window.location.href;
            if (navigator.share) navigator.share({ title: document.querySelector('h2')?.textContent, url });
            else { navigator.clipboard.writeText(url); alert('Link copied!'); }
        }

        function loadComments() {
            db.ref('comments').orderByChild('videoId').equalTo(videoId).on('value', snap => {
                const list = document.getElementById('commentsList');
                if (!list) return;
                let html = '';
                snap.forEach(child => {
                    const c = child.val();
                    html += `<div class="comment">
                        <strong>${c.author}</strong> <small style="color:var(--text-secondary);">${getTimeAgo(c.timestamp)}</small>
                        <p style="margin-top:0.3rem;">${c.text}</p>
                    </div>`;
                });
                list.innerHTML = html || '<p>No comments yet.</p>';
            });
        }

        function postComment() {
            const input = document.getElementById('commentInput');
            const text = input.value.trim();
            if (!text) return;
            if (!currentUser) { alert('Sign in first'); return; }
            db.ref('comments').push({
                videoId,
                author: currentUser.email.split('@')[0],
                text,
                timestamp: Date.now()
            }).then(() => input.value = '');
        }

        function getTimeAgo(ts) {
            if (!ts) return '';
            const s = (Date.now() - ts) / 1000;
            if (s < 60) return 'Just now';
            if (s < 3600) return Math.floor(s/60)+'m ago';
            if (s < 86400) return Math.floor(s/3600)+'h ago';
            if (s < 604800) return Math.floor(s/86400)+'d ago';
            return new Date(ts).toLocaleDateString();
        }
    </script>
</body>
</html>
