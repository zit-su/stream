<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Upload - Streamify</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="brand"><i class="bi bi-play-circle"></i> Streamify</a>
            <button class="hamburger" id="menuToggle"><i class="bi bi-list"></i></button>
            <div class="nav-links" id="navMenu">
                <a href="index.html">Home</a>
                <a href="my-uploads.html" class="active">Upload</a>
            </div>
            <div class="auth-area" id="authButtons">
                <a href="login.html" class="btn btn-outline btn-sm">Sign In</a>
            </div>
        </div>
    </nav>

    <div style="max-width:600px; margin:1.5rem auto; padding:0 1rem;">
        <div class="form-container">
            <h3 style="margin-bottom:1rem;"><i class="bi bi-cloud-upload"></i> Upload Video</h3>
            <div class="upload-area" id="dropZone">
                <i class="bi bi-camera-video" style="font-size:2.5rem;"></i>
                <p>Tap to select or drop a video</p>
                <small style="color:var(--text-secondary);">MP4, WebM (max 50MB)</small>
            </div>
            <input type="file" id="videoFile" accept="video/*" style="display:none;">
            <img id="thumbnailPreview" style="width:100%; max-height:200px; object-fit:cover; border-radius:8px; margin-top:1rem; display:none;">
            <div class="form-group">
                <label class="form-label">Title</label>
                <input type="text" class="form-control" id="videoTitle" placeholder="My awesome video">
            </div>
            <div class="form-group">
                <label class="form-label">Description (optional)</label>
                <textarea class="form-control" id="videoDescription" rows="2"></textarea>
            </div>
            <button class="btn btn-primary w-100" id="uploadSubmitBtn"><i class="bi bi-upload"></i> Upload</button>
            <p id="uploadStatus" class="mt-2" style="color:var(--accent); font-size:0.9rem;"></p>
        </div>

        <h3 style="margin:2rem 0 1rem;">Your Uploads</h3>
        <div id="myUploadsList" style="display:grid; gap:0.8rem;"></div>
    </div>

    <div class="bottom-nav">
        <a href="index.html"><i class="bi bi-house-door"></i><span>Home</span></a>
        <a href="my-uploads.html" class="active"><i class="bi bi-plus-circle-fill"></i><span>Upload</span></a>
        <a href="login.html"><i class="bi bi-person-circle"></i><span>Sign In</span></a>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAAPNK7PEPK90SMSQDCSne3wBr1OYoAXxM",
            authDomain: "store-data-for-sms.firebaseapp.com",
            databaseURL: "https://store-data-for-sms-default-rtdb.firebaseio.com",
            projectId: "store-data-for-sms",
            storageBucket: "store-data-for-sms.firebasestorage.app",
            messagingSenderId: "508840668923",
            appId: "1:508840668923:web:0e1e9ebc788bdf1e74ca5e"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        const menuToggle = document.getElementById('menuToggle');
        const navMenu = document.getElementById('navMenu');
        menuToggle.addEventListener('click', () => navMenu.classList.toggle('open'));

        let currentUser = null;
        auth.onAuthStateChanged(user => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            currentUser = user;
            document.getElementById('authButtons').innerHTML = `<span>${user.email.split('@')[0]}</span>
                <button class="btn btn-outline btn-sm" id="logoutBtn">Logout</button>`;
            document.getElementById('logoutBtn').addEventListener('click', () => auth.signOut());
            // Bottom nav profile
            const bottomProfile = document.querySelector('.bottom-nav a[href="login.html"]');
            if (bottomProfile) {
                bottomProfile.innerHTML = '<i class="bi bi-person-check-fill"></i><span>Profile</span>';
                bottomProfile.href = 'my-uploads.html';
            }
            loadMyUploads();
        });

        // Drag & Drop / file selection
        const dropZone = document.getElementById('dropZone');
        dropZone.addEventListener('click', () => document.getElementById('videoFile').click());
        dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
        dropZone.addEventListener('drop', e => {
            e.preventDefault();
            dropZone.classList.remove('drag-over');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('video/')) handleFile(file);
        });
        document.getElementById('videoFile').addEventListener('change', e => {
            if (e.target.files[0]) handleFile(e.target.files[0]);
        });

        function handleFile(file) {
            // Show thumbnail preview
            const video = document.createElement('video');
            video.preload = 'metadata';
            video.src = URL.createObjectURL(file);
            video.onloadeddata = () => { video.currentTime = 1; };
            video.onseeked = () => {
                const canvas = document.createElement('canvas');
                canvas.width = 320; canvas.height = 180;
                canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
                const thumb = document.getElementById('thumbnailPreview');
                thumb.src = canvas.toDataURL('image/jpeg', 0.7);
                thumb.style.display = 'block';
            };
        }

        document.getElementById('uploadSubmitBtn').addEventListener('click', async () => {
            const file = document.getElementById('videoFile').files[0];
            if (!file) return alert('Please select a video file.');
            const title = document.getElementById('videoTitle').value.trim();
            if (!title) return alert('Please enter a title.');
            if (file.size > 50 * 1024 * 1024) return alert('File too large (max 50MB).');

            const statusP = document.getElementById('uploadStatus');
            statusP.textContent = 'Uploading...';

            const formData = new FormData();
            formData.append('file', file);
            formData.append('title', title);

            try {
                const response = await fetch('https://sunnymavale-app.hf.space/upload', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const text = await response.text();
                    throw new Error('Upload failed: ' + text.substring(0, 100));
                }

                const result = await response.json();
                const videoUrl = `https://sunnymavale-app.hf.space/videos/${result.filename}`;

                // Save to Firebase
                await db.ref('videos').push({
                    title,
                    description: document.getElementById('videoDescription').value.trim(),
                    url: videoUrl,
                    thumbnail: document.getElementById('thumbnailPreview').src || 'https://via.placeholder.com/320x180',
                    channel: currentUser.email.split('@')[0],
                    channelIcon: currentUser.email.charAt(0).toUpperCase(),
                    uploaderId: currentUser.uid,
                    views: 0,
                    likes: 0,
                    timestamp: Date.now()
                });

                statusP.textContent = 'Upload successful!';
                // Clear form
                document.getElementById('videoFile').value = '';
                document.getElementById('videoTitle').value = '';
                document.getElementById('videoDescription').value = '';
                document.getElementById('thumbnailPreview').style.display = 'none';
                loadMyUploads();
            } catch (error) {
                console.error(error);
                statusP.textContent = 'Error: ' + error.message;
            }
        });

        function loadMyUploads() {
            if (!currentUser) return;
            db.ref('videos').orderByChild('uploaderId').equalTo(currentUser.uid).once('value')
            .then(snap => {
                const list = document.getElementById('myUploadsList');
                const videos = [];
                snap.forEach(child => videos.push({ id: child.key, ...child.val() }));
                videos.sort((a,b) => (b.timestamp||0) - (a.timestamp||0));
                if (!videos.length) {
                    list.innerHTML = '<p class="text-center">No uploads yet.</p>';
                    return;
                }
                list.innerHTML = videos.map(v => `
                    <div style="background:var(--bg-card); border-radius:var(--radius); padding:0.8rem; display:flex; justify-content:space-between; align-items:center;">
                        <div>
                            <div style="font-weight:500;">${v.title || 'Untitled'}</div>
                            <div style="font-size:0.8rem; color:var(--text-secondary);">${v.views || 0} views</div>
                        </div>
                        <a href="watch.html?id=${v.id}" class="btn btn-outline btn-sm">Watch</a>
                    </div>
                `).join('');
            });
        }
    </script>
</body>
</html>
